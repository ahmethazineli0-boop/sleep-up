# Her push'ta GitHub'ın bulut makinelerinde derler.
# iOS: imzasız .ipa (Sideloadly ile ücretsiz Apple hesabıyla yüklenir).
# Android: kontrol amaçlı debug APK.
name: Derleme

on:
  push:
  workflow_dispatch:

jobs:
  ios:
    name: iPhone (.ipa)
    runs-on: macos-15
    permissions:
      contents: write
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: iOS proje dosyalarını oluştur
        run: flutter create --org com.sleepup --project-name sleep_up --platforms ios .

      - name: Paketler ve testler
        run: |
          flutter pub get
          flutter test

      - name: Derle (imzasız)
        run: flutter build ios --release --no-codesign

      - name: .ipa paketle
        run: |
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry SleepUp.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SleepUp-iPhone
          path: SleepUp.ipa
          retention-days: 30

      # Herkese açık indirme bağlantısı:
      # https://github.com/<kullanıcı>/sleep-up/releases/latest/download/SleepUp.ipa
      - name: Sürüm olarak yayınla
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Deneme sürümü ${{ github.run_number }}
          files: SleepUp.ipa
          make_latest: true

  android:
    name: Android (.apk)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android proje dosyalarını oluştur
        run: flutter create --org com.sleepup --project-name sleep_up --platforms android .

      - name: Derle
        run: |
          flutter pub get
          flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: SleepUp-Android
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
